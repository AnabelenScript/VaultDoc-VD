<div class="historial-container">
  <div class="convert-header">
    <div class="search-section">
      <div class="search-bar">
        <i class="search-icon"><i class='bx bx-search-alt-2'></i></i>
        <input 
          type="text" 
          placeholder="Buscar" 
          [(ngModel)]="searchTerm"
          (keyup.enter)="onSearch()"
          class="search-input">
        <button class="filter-button" type="button"></button>
      </div>
    </div>

    <div class="actions-section">
      <div class="archive-count">
        <span class="archive-label">Personas:</span>
        <span class="archive-number">{{ archiveCount }}</span>
      </div>
    </div>
  </div>
  <div class="historial-list">
  <div *ngFor="let entry of historial" class="historial-card">
    <div class="historial-row historial-table header-row">
      <span class="label">Archivo:</span>
      <span class="label">Acción:</span>
      <span class="label">Fecha:</span>
      <span class="label">Usuario:</span>
    </div>
    <div class="historial-row historial-table">
      <span class="value">{{ entry.Id_file.nombre }}</span>
      <span class="value">{{ entry.Movimiento }}</span>
      <span class="value">{{ entry.Fecha_registro }}</span>
      <span class="value">{{ entry.Id_user.nombre }}</span>
    </div>
    <div class="historial-divider"></div>
  </div>

  <!-- Elemento estático -->
  <div class="historial-card static-preview">
    <div class="historial-row historial-table header-row">
      <span class="label">Archivo:</span>
      <span class="label">Acción:</span>
      <span class="label">Fecha:</span>
      <span class="label">Usuario:</span>
    </div>
    <div class="historial-row historial-table">
      <span class="value">informe_final.pdf</span>
      <span class="value">Subida</span>
      <span class="value">2025-09-07 14:35</span>
      <span class="value">Anna</span>
    </div>
    <div class="historial-divider"></div>
  </div>
</div>


</div>
